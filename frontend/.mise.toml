[tools]
node = "latest"
pnpm = "latest"

[tasks.install]
description = "Install dependencies"
run = "pnpm i"

[tasks.app]
description = "Run the application"
usage = '''
flag "--back" {
    help "Run the application with backend proxy"
}
'''
run = '''
if [ "$usage_back" = "true" ]; then
    pnpm run dev2back
else
    pnpm run dev
fi
'''

[tasks.storybook]
description = "Run Storybook"
run = "pnpm run storybook"

[tasks.checks]
description = "Run checks"
sources = [
    "./**/*.{ts,tsx,js,jsx}",
    "./**/*.css",
    "./**/*.svg",
    "./**/*.html",
]
usage = '''
flag "--fix" {
    help "Enable automatic fixes"
}
'''
quiet = true
run = """
pnpm -s run typecheck
if [ "$usage_fix" = "true" ]; then
    pnpm -s run prettier:write
    pnpm -s run eslint:fix
    pnpm -s run stylelint:fix
else
    pnpm -s run prettier
    pnpm -s run eslint
    pnpm -s run stylelint
fi
"""

[tasks.tests]
description = "Run tests, silent unless something fails"
quiet = true
run = '''
if ! output=$(NODE_NO_WARNINGS=1 pnpm -s run vitest 2>&1); then
    printf '%s\n' "$output"
    exit 1
fi
'''

[tasks.build]
description = "Build the application, silent unless the build fails"
quiet = true
run = '''
if ! output=$(pnpm -s run build 2>&1); then
    printf '%s\n' "$output"
    exit 1
fi
'''